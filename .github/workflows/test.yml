---
# daedalus-sdk 仓 CI(拆仓后本文件即 SDK 仓的 .github/workflows/test.yml)。
#
# 职责:go vet + go test(含 3 点漂移测试:policy.toml ↔ policy.Default() ↔
# objectmodel 常量)+ 跨仓 layout 漂移守门(拒绝 module 路径含 daedalus-os)。
#
# 注意:testdata drift 守门(生产 policy.toml ↔ SDK testdata 副本)不放本仓——
# SDK 仓独立 CI 没有 daedalus-core 兄弟仓,diff 无法跑;该守门放 core 仓
# build.yml(core 仓有 SDK 兄弟 checkout + 生产 policy.toml,review Oracle
# Issue 3 修正)。同理 plugin 包的 TestValidate_OfficialPluginManifests 要读
# ../../daedalus-plugins 与 ../../daedalus-core,而 Actions 不许 checkout 逃出
# GITHUB_WORKSPACE → 本仓 CI 里它显式 skip,真实执行点是 core 仓 build.yml 的
# "Official manifest cross-repo gate"(那里三仓平级检出)。
name: SDK Test
on:
  pull_request:
    # 反向白名单:仅忽略纯文档,其余路径变更都触发 CI。
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

# 并发:同一 ref 同一 workflow 同时只跑一个;新 push 自动取消旧 run。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

# 最小权限默认 contents:read。
permissions:
  contents: read

jobs:
  test:
    name: Test (go vet / go test / drift)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 本 job 没有任何一步靠 .git/config 的 http.extraheader 取凭据
          # (go vet / go test / grep 都不需要),不留跨 step 存活的 token。
          persist-credentials: false
      - name: Set Up Go Toolchain
        # go.mod pins `go 1.25.0`;runner image 可能更老,显式 pin。
        # setup-go 缓存 go.sum;vendor/ 不入库,首次构建走 module proxy。
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          # 本 job 由 pull_request 触发 → 显式关掉 module cache:cache 按分支
          # 作用域共享,基础分支能读到 PR 分支写入的条目(实测本仓已存在
          # refs/pull/36/merge 写入的 setup-go 条目),那是 cache 投毒的读侧。
          cache: false
          cache-dependency-path: go.sum

      - name: GoReleaser config check
        # release.yml 只在 tag push 时执行,PR 上没人读 .goreleaser.yml —— 一个
        # 不存在的配置键会一路活到首个 tag 才爆(本仓 0.1.0 那次就是这么爆的)。
        # 版本与 release.yml 钉同一档,否则「PR 上 check 过、tag 时换版本又炸」。
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: 'v2.20.2'
          args: check

      - name: Go Vet
        # 静态检查:未用 import / 可疑构造等。
        shell: bash
        run: go vet ./...

      - name: Go Test (含 3 点漂移测试)
        # 全量单测,含 policy/objectmodel 的 3 点漂移测试(policy.toml ↔
        # policy.Default() ↔ objectmodel 常量,三点防漂移链)。
        shell: bash
        run: go test ./...

      - name: Cross-repo layout drift gate
        # 跨仓 layout 漂移守门:拒绝 module 路径含 daedalus-os(旧前缀,拆仓后
        # 必须为 github.com/Daedalusys/...)。go.mod 与全部 .go 文件都扫。
        shell: bash
        run: |
          if grep -rn "daedalus-os" --include="*.go" --include="go.mod" . 2>/dev/null | grep -v "^\./\.git"; then
            echo "FAIL: 检测到旧 module 前缀 daedalus-os(应为 github.com/Daedalusys/...)" >&2
            exit 1
          fi
          echo "OK: 无 daedalus-os 残留"