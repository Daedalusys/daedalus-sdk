---
# daedalus-sdk 仓 release pipeline(拆仓后本文件即 SDK 仓的
# .github/workflows/release.yml;review Oracle Issue 2 + Issue 6 新增)。
#
# 背景:原 plan 漏了 SDK 的 release pipeline,第三方无法
# `go get github.com/Daedalusys/daedalus-sdk@vX.Y.Z`。本 workflow 补上:
#   - tag-driven:推送 v* tag 触发(如 v0.1.0)
#   - go test ./... 守门
#   - goreleaser 发布(review Oracle Issue 6 定版:SLSA L2 provenance + SBOM
#     用 goreleaser 原生支持,不用 gh release create 手工拼)
#   - 上传 semver 化的 source tarball + provenance attestations(SLSA build
#     level 2 目标)
#
# 配置见仓根 .goreleaser.yml(SDK 是纯库无二进制,只产 source tarball +
# SBOM + provenance)。
name: SDK Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# goreleaser 需要创建 GitHub release(contents: write)与 OIDC token
# (id-token: write,SLSA provenance 签名用)。
permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release (goreleaser, SLSA L2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # goreleaser 需要完整 git 历史(计算 changelog 与 tag 信息)
          fetch-depth: 0

      - name: Set Up Go Toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum

      - name: Go Test
        # 发布前守门:全量单测(含 3 点漂移测试)必须绿才出 release。
        shell: bash
        run: go test ./...

      - name: Run GoReleaser
        # goreleaser 原生产出:source tarball + SBOM(syft)+ SLSA provenance
        # (cosign,经 OIDC 签名),并创建 GitHub release 上传全部资产。
        # --clean 清掉上一轮 dist/ 残留,保证可复现。
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}