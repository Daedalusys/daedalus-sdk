# daedalus-sdk 的 goreleaser 配置(被 .github/workflows/release.yml 消费)。
#
# SDK 是纯库(无二进制),goreleaser 不构建任何可执行文件,只产出:
#   - source tarball(semver 化,第三方 `go get github.com/Daedalusys/daedalus-sdk@vX.Y.Z`
#     消费)
#   - SBOM(syft 生成,附到 release)
#
# SLSA provenance 不在本配置里:goreleaser v2 没有 provenance 配置键(它只给
# docker 构建补 --provenance 旗标,对 source 资产无效)。source 资产的 L2
# attestation 由 release.yml 的 actions/attest 步骤对 dist/ 产物生成。
version: 2

project_name: daedalus-sdk

# 无二进制:SDK 是库,skip 全部 build。
builds:
  - skip: true

# source tarball:goreleaser 默认产出 <project>-<version>-source.tar.gz。
source:
  enabled: true

# SBOM:syft 对 source 资产生成软件物料清单。v2 的键是 `sboms`(列表)且没有
# `enabled`——写成单数 `sbom:` 会在 `goreleaser release` 启动期直接 unmarshal
# 失败。runner 侧需预装 syft,由 workflow 的 download-syft 步负责。
sboms:
  - artifacts: source
