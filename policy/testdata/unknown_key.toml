# 测试夹具:含未知键的合法 TOML。Load 必须拒绝
# (拦截拼写错误,杜绝"以为改了其实没改"的第二事实源错觉)。
[shell]
allowed_commands = ["df", "ls"]
binary_dirs = ["/usr/bin"]
allowed_path_prefixes = ["/tmp"]
blocked_paths = ["/root"]
clean_env = { PATH = "/usr/bin", LANG = "C" }
timeout_ms = 1000
allowed_commandz = ["typo"]

[fs]
allowed_dirs = ["/tmp"]
allowed_directorys = ["/nope"]

[audit]
log_path = "/tmp/x.jsonl"
