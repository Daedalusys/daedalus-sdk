# internal/policy 测试夹具:结构完整但取值刻意偏离默认值的合法策略,
# 用于证明 Load 逐字段透传(而不是偷偷回退 Default)。
[shell]
allowed_commands = ["echo", "date"]
binary_dirs = ["/usr/bin", "/bin"]
allowed_path_prefixes = ["/tmp"]
blocked_paths = ["/root"]
clean_env = { PATH = "/usr/bin:/bin", LANG = "C" }
timeout_ms = 5000

[fs]
allowed_dirs = ["/tmp"]

[audit]
log_path = "/tmp/daedalus-policy-test-audit.jsonl"
max_size_mb = 256
retain_days = 30

[state]
max_size_mb = 64

# objectmodel 段取值同样刻意偏离 Default()(启用 service / package / task /
# container / policy 五类 kind),证明 [objectmodel].enabled_kinds 逐字段透传解析。
[objectmodel]
enabled_kinds = ["service", "package", "task", "container", "policy"]

# blueprints 段取值同样刻意偏离 Default()(output_dirs 用 /tmp 而非真实目录等),
# 证明 [blueprints] 各字段逐字段透传解析。
[blueprints]
output_dirs = ["/tmp"]
post_check_commands = ["nginx"]
reload_services = ["nginx"]
secret_sources = ["kwallet"]

# fleet 段取值同样刻意偏离 Default()(用短列表与不同数值),证明 [fleet]
# 各字段逐字段透传解析。
[fleet]
high_risk_packages = ["kernel"]
high_risk_path_prefixes = ["/etc"]
high_risk_services = ["sshd"]
high_risk_adapters = ["bootc.upgrade"]
transient_retry_max = 5
heartbeat_timeout_seconds = 60
