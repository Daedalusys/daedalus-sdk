---
# daedalus-sdk 仓 release pipeline。
#
# 目的:第三方能 `go get github.com/Daedalusys/daedalus-sdk@vX.Y.Z`(`go get`
# 只依赖 git tag;semver 化的 source tarball 与 SBOM 是随 release 分发的资产)。
#   - tag-driven:推送 v* tag 触发(如 v0.1.0)
#   - go test ./... 守门
#   - goreleaser 发布 source tarball + SBOM(syft)
#
# SLSA provenance:goreleaser v2 没有 provenance 配置键,故由本 workflow 用
# GitHub 原生 artifact attestation(`actions/attest`)对 source tarball 出
# SLSA v1.0 Build L2 证明;消费方用 `gh attestation verify <tarball> --repo
# <owner>/<repo>` 校验(不是 slsa-verifier)。
#
# 配置见仓根 .goreleaser.yml(SDK 是纯库无二进制)。
name: SDK Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# contents: goreleaser 创建 GitHub release 并上传资产。
# id-token: attestation 用 OIDC token 换 Sigstore 签名身份。
# attestations: attestation 写入本仓 attestation 存储。
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Release (goreleaser, source + SBOM)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 不把 GITHUB_TOKEN 持久化进 .git/config:goreleaser 从 env 取
          # GITHUB_TOKEN(sdk release 步骤显式传 secrets.GITHUB_TOKEN),不读
          # .git/config 的 http.extraheader;fetch-depth: 0 取历史同样不需要凭据。
          persist-credentials: false
          # goreleaser 需要完整 git 历史(计算 changelog 与 tag 信息)
          fetch-depth: 0

      - name: Set Up Go Toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          # 本 workflow 只由 tag push / workflow_dispatch 触发,不接受 PR ——
          # 缓存条目不会被 PR 分支写入,故保留 cache(发布腿提速)。
          cache: true
          cache-dependency-path: go.sum

      - name: Go Test
        # 发布前守门:全量单测(含 3 点漂移测试)必须绿才出 release。
        shell: bash
        run: go test ./...

      - name: Install syft (SBOM 生成器)
        # goreleaser 的 `sboms` 段默认 `cmd: syft`,而 GitHub 托管 runner 不预装;
        # 缺 syft 时 goreleaser 会在 SBOM 步直接失败。
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Run GoReleaser
        # goreleaser 产出:source tarball + SBOM(syft),并创建 GitHub release
        # 上传全部资产。--clean 清掉上一轮 dist/ 残留,保证可复现。
        # version 钉具体版本:latest 只锁 `~> v2`,小版本会改配置语义且随上游漂。
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: 'v2.20.2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest source tarball provenance
        # subject-path 用 glob:source 管道产物名由 name_template 决定(默认
        # `<project>-<version>.tar.gz`),写死版本号会随 tag 漂移。attestation
        # 以文件摘要为 subject,故放在 goreleaser 之后不影响与已上传资产的对应。
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
