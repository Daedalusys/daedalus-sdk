# =============================================================================
# Daedalus 能力策略单一事实源(single source of truth)
#
# 本文件定义 shell / fs 能力服务器运行时强制执行的白名单、路径规则、
# 执行环境与超时。Go 侧由 internal/policy 在服务器启动时读取
# (解析优先级:DAEDALUS_POLICY_PATH 环境变量 > 本文件生产路径
# /opt/daedalus/shared/policy.toml > 仓库内开发态回溯路径);
# 文件缺失时各服务器回退到 internal/policy.Default() 的内嵌默认值,
# 保证"无 policy 也能启动"。
#
# 任何值变更都必须与 internal/shellpolicy、internal/pathguard 的
# 一致性钉死测试以及 copilot 冻结副本(daedalus/plugin/copilot/policy.ts)
# 同步评审。
#
# ALLOW_COMMANDS 环境变量语义为整体替换(REPLACE,非并集):
# 存在且非空时,逗号分隔的命令集合整体取代 [shell].allowed_commands。
#
# Object Model 字段([objectmodel].enabled_kinds 及各 kind 的资源 schema)的
# 语义与校验规则单一事实源见 daedalus/core/internal/objectmodel/objectmodel.go;
# 三点漂移测试(policy.toml ↔ policy.Default() ↔ objectmodel 常量)钉死三侧一致。
# =============================================================================

[shell]
# 命令基名白名单(15 项只读/诊断命令,逐字对齐 internal/shellpolicy.DefaultAllowCommands)。
allowed_commands = ["df", "ls", "cat", "pwd", "uname", "free", "ps", "uptime", "whoami", "ip", "arch", "hostname", "date", "ping", "systemctl"]

# 允许命令所在的二进制目录(带 '/' 前缀的命令路径 realpath 后必须落于其中之一)。
binary_dirs = ["/usr/bin", "/bin", "/usr/sbin", "/sbin"]

# 路径型参数允许的前缀白名单(9 项,逐字对齐 internal/shellpolicy.AllowedPathPrefixes)。
allowed_path_prefixes = ["/home", "/var/log", "/tmp", "/proc", "/sys", "/etc/os-release", "/usr/lib/os-release", "/etc/fedora-release", "/etc/almalinux-release"]

# 显式禁止的敏感路径(5 项,前缀匹配带 '/' 边界,优先于允许前缀)。
blocked_paths = ["/etc/shadow", "/etc/gshadow", "/etc/sudoers", "/etc/sudoers.d", "/root"]

# 子进程净化执行环境(键值对整体替换,零继承宿主环境变量)。
clean_env = { PATH = "/usr/bin:/bin:/usr/sbin:/sbin", LANG = "C.UTF-8" }

# 命令执行超时(毫秒;到期对整个进程组 SIGKILL,回传退出码 124)。
timeout_ms = 30000

[fs]
# 文件系统能力服务器可访问的目录白名单(3 项,逐字对齐 internal/pathguard.AllowedDirs)。
allowed_dirs = ["/home", "/var/log", "/tmp"]

[audit]
# 哈希链审计日志路径(运行时仍可被 DAEDALUS_AUDIT_LOG_PATH 环境变量覆盖)。
log_path = "/var/log/daedalus/audit.jsonl"
# audit.jsonl 轮转阈值(MB)与归档保留天数(retain_days 硬底线 >=30)。
max_size_mb = 256
retain_days = 30

[state]
# state.jsonl 缓存轮转阈值(MB)。
max_size_mb = 64

[objectmodel]
# 对象模型资源 kind 的正向启用白名单(与 [shell]/[fs]/[audit] 并列的第四策略节):
# 声明式列出**启用**哪些 kind,未列入即未启用;具体 kind 语义与校验规则由
# 单一事实源 daedalus/core/internal/objectmodel/objectmodel.go 定义
# (v1 启用六类:service / package / file / task / container / policy;file 的回滚点
# 由 agent 内建的单文件 copy 提供,不是宿主 provider;capability / transaction 仍为保留枚举位)。
# fail-closed:空列表视为损坏策略,Go 服务器启动时拒绝加载。
# 本值与 internal/policy.Default() 及 objectmodel 常量由防漂移测试三点钉死。
enabled_kinds = ["service", "package", "file", "task", "container", "policy"]

[blueprints]
# 蓝图(blueprint)渲染/校验/重载/密钥来源策略节(与 [shell]/[fs]/[audit]/
# [objectmodel] 并列的第五策略节):声明式列出蓝图渲染输出允许目录、
# post_check 可执行命令白名单、reload 允许触发的服务名与 secret 引用解析来源。
# fail-closed:任一空列表视为损坏策略,Go 服务器启动时拒绝加载。
# 本值与 internal/policy.Default() 由三点漂移测试(todo 9)钉死一致;
# post_check 白名单的运行时消费方见 internal/shellpolicy 的
# RegisterBlueprintsPostCheckSource 钩子(todo 16 由 MCP server 启动时注册)。

# 蓝图渲染输出的允许目录(前缀白名单,与 pathguard 联动)。
output_dirs = ["/etc/nginx/conf.d", "/etc/haproxy", "/etc/postgresql", "/etc/redis"]

# post_check 可执行的命令白名单(严格子集,独立于 [shell].allowed_commands)。
post_check_commands = ["nginx", "haproxy", "psql", "redis-cli", "systemctl", "grep"]

# reload 允许触发的服务名(经 daedalus-tx 的 service.set 通道)。
reload_services = ["nginx", "haproxy", "postgresql", "redis"]

# secret 引用解析来源(用户态)。
secret_sources = ["kwallet", "credstore"]

[confirmation]
# confirm_token 单次性契约的全局参数(与 [shell]/[fs]/[audit]/[objectmodel]/[blueprints]
# 并列的第六策略节):
# 实际生效值在 `../daedalus-sdk/confirmation` 包内(confirmTokenTTL 常量),policy.toml
# 此处为文档/诊断参考;改 TTL 必须改 confirmation 常量并跑 drift 测试。
# ttl_seconds 必须与 confirmation.ConfirmTokenTTL 同步(900 = 15 分钟)。
ttl_seconds = 900

# 单进程未消费令牌上限;超限由 confirmation 包自行 purge 最早签发。
max_pending_tokens = 1000

[diskclean]
# daedalus.disk-clean 插件(daedalus-plugins#1)的写白名单与旧内核路径模板:
# 与 [fs].allowed_dirs 是两层(全局 / 插件)关系——插件启动时经
# pathguard.WithAllowedDirs 把本节合并进全局 AllowedDirs。
# 本节定义的是"插件可写"的上限(经 pathguard.ValidateWritePath 二档校验),
# 真正的写盘仍需走 daedalus-tx 的 disk.clean 适配器(事务通道)。

# 可写目录(issue #1 数据源:journal / dnf cache / PackageKit / coredump / 旧 /tmp)。
allowed_write_dirs = ["/var/log/journal", "/var/cache/dnf", "/var/cache/PackageKit", "/var/lib/systemd/coredump", "/var/tmp", "/home"]

# 旧内核路径模板(rpm -q kernel 解析后命中此前缀的目录视为"旧内核可清理")。
old_kernel_dir_pattern = "/boot"

[ownership]
# 资源 ownership 模式策略节(P4/V6 P4 controller 入口,core#2):
# 声明式列出资源 kind 的管理 ownership 模式。
# 模式枚举(封闭,逐字对齐 daedalus-sdk/policy.OwnershipMode):
#   "unmanaged"             — 平台只观测不驱动(默认最保守)
#   "observe"               — 报告 drift,不自动驱动
#   "managed/manual"        — 变更仍走显式 tx,人在环
#   "managed/reconcile"     — controller 持续驱动 desired→observed
# fail-closed:default 不在枚举 / by_kind 引用未启用 kind → 启动拒绝。
# 本值与 internal/policy.Default() 由三点漂移测试钉死一致。
default = "unmanaged"

[ownership.by_kind]
# service 一律 observe:用户能看见 drift 但 controller 不会自动驱动;
# 用户切到 managed/reconcile 时需要按 kind/name 粒度显式声明(P4.5 overrides 切片)。
service = "observe"

[fleet]
# 跨机 Plan 的风险默认值策略节(第八策略节;与 [shell]/[fs]/[audit]/[objectmodel]/
# [blueprints]/[confirmation]/[ownership] 并列):声明式列出哪些 (kind, target)
# 组合默认为高危。控制面据此把每条 intent 判成 low / high,并决定失败分桶:
# low 的瞬时失败可自动重试,high 的任何失败立即暂停整批。
# fail-closed:表外 kind 或无法判定一律折向 high;四个列表任一为空、或两个数值
# 非正,均视为损坏策略,启动拒绝加载。人审可显式把 low 标 high,反向不成立。
# 本值与 policy.Default() 由三点漂移测试
# (TestPolicy_Fleet_DefaultMatchesRealToml)钉死,且与 daedalus-core 的生产
# policy.toml 逐字节一致(CI 的 testdata drift gate 守门)。

# package.set 触即高危的包名/前缀(内核与 security 包)。
high_risk_packages = ["kernel", "systemd", "dbus", "NetworkManager", "selinux", "polkit", "openssh"]

# file.set 触即高危的路径前缀('/' 边界匹配:/etc 命中 /etc/...,不命中 /etcfoo/...)。
high_risk_path_prefixes = ["/etc", "/boot", "/usr", "/var/lib"]

# service.set 触即高危的 systemd 单元名/前缀。
high_risk_services = ["systemd", "dbus", "NetworkManager", "sshd"]

# 无条件高危的适配器(bootc 升级/切换/回滚)。
high_risk_adapters = ["bootc.switch", "bootc.upgrade", "bootc.rollback"]

# 低危 intent 遇瞬时失败时的最大自动重试次数。
transient_retry_max = 3

# agent 心跳超时(秒),与 agent 侧心跳间隔同源。
heartbeat_timeout_seconds = 30
