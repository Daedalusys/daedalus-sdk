---
# daedalus-sdk 仓 release pipeline。
#
# 目的:第三方能 `go get github.com/Daedalusys/daedalus-sdk@vX.Y.Z`(`go get`
# 只依赖 git tag;semver 化的 source tarball 与 SBOM 是随 release 分发的资产)。
#   - tag-driven:推送 v* tag 触发(如 v0.1.0)
#   - go test ./... 守门
#   - goreleaser 发布 source tarball + SBOM(syft)
#
# SLSA provenance 尚未接:goreleaser 没有原生 provenance 支持,得另走
# slsa-github-generator 复用 workflow(issue #40 跟踪)。在此之前本 workflow
# 不申请 id-token 权限,也不对外声称产出了 attestation。
#
# 配置见仓根 .goreleaser.yml(SDK 是纯库无二进制)。
name: SDK Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# goreleaser 需要创建 GitHub release 并上传资产(contents: write)。
# 不申请 id-token:当前没有 provenance 签名步骤(见文件头)。
permissions:
  contents: write

jobs:
  release:
    name: Release (goreleaser, source + SBOM)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # goreleaser 需要完整 git 历史(计算 changelog 与 tag 信息)
          fetch-depth: 0

      - name: Set Up Go Toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache-dependency-path: go.sum

      - name: Go Test
        # 发布前守门:全量单测(含 3 点漂移测试)必须绿才出 release。
        shell: bash
        run: go test ./...

      - name: Install syft (SBOM 生成器)
        # goreleaser 的 `sboms` 段默认 `cmd: syft`,而 GitHub 托管 runner 不预装;
        # 缺 syft 时 goreleaser 会在 SBOM 步直接失败。
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3

      - name: Run GoReleaser
        # goreleaser 产出:source tarball + SBOM(syft),并创建 GitHub release
        # 上传全部资产。--clean 清掉上一轮 dist/ 残留,保证可复现。
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}